name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: community-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm.cmd ci
      - name: Verify stable tag belongs to main
        shell: pwsh
        run: |
          $authority = Get-Content -Raw product-version.json | ConvertFrom-Json
          if ($authority.channel -ne "stable") { throw "product channel must be stable" }
          if ("${{ github.ref_name }}" -ne "v$($authority.version)") { throw "tag does not match product version" }
          git fetch --no-tags origin main
          $sourceCommit = (git rev-parse "${{ github.ref_name }}^{commit}").Trim()
          if ($sourceCommit -notmatch "^[0-9a-f]{40}$") { throw "release source commit is invalid" }
          git merge-base --is-ancestor $sourceCommit "origin/main"
          if ($LASTEXITCODE -ne 0) { throw "stable release tag must belong to main" }
          if (git status --porcelain=v1) { throw "release source must remain clean" }
          "COMMUNITY_SOURCE_COMMIT=$sourceCommit" >> $env:GITHUB_ENV
      - name: Verify completed community stable acceptance
        shell: pwsh
        run: npm.cmd run release:community:acceptance -- --release-commit "$env:COMMUNITY_SOURCE_COMMIT"
      - name: Verify project
        run: npm.cmd run verify
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows application
        run: npm.cmd run tauri build
      - name: Confirm release build kept source clean
        shell: pwsh
        run: |
          if (git status --porcelain=v1) { throw "release build changed tracked source" }
      - name: Prepare source-bound community release files
        shell: pwsh
        run: npm.cmd run release:community:prepare -- --tag "${{ github.ref_name }}" --commit "$env:COMMUNITY_SOURCE_COMMIT" --output-dir release-assets
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --verify-tag --notes-file release-assets/RELEASE_NOTES.md --title "圆圆提醒 ${{ github.ref_name }}"
