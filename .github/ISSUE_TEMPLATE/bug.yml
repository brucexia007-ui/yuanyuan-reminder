name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除截图和日志中的任务内容、用户名、路径等个人信息。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 例如 1.3.0 安装版
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 与屏幕缩放
      placeholder: 例如 Windows 11 24H2，125%，双屏
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请列出最短复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: 截图或日志
      description: 可选；请先确认不含私人信息。
